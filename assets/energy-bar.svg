<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E56" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#FF1E56" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00D2FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulseEnergy {
      0%, 100% { opacity: 0.7; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.4); }
    }
    @keyframes runPulse {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(950px); }
    }
    .pulse-dot {
      animation: runPulse 4s ease-in-out infinite;
    }
  </style>
  <line x1="10" y1="12" x2="890" y2="12" stroke="url(#divGrad)" stroke-width="2" filter="url(#laserGlow)"/>
  <polygon points="450,4 458,12 450,20 442,12" fill="#A855F7" filter="url(#laserGlow)"/>
  <circle cx="0" cy="12" r="3.5" fill="#FF1E56" class="pulse-dot" filter="url(#laserGlow)"/>
  <circle cx="0" cy="12" r="2.5" fill="#00D2FC" class="pulse-dot" filter="url(#laserGlow)" style="animation-delay: 2s;"/>
</svg>
